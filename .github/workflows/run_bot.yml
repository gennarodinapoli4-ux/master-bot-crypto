name: Master Bot Auto Run

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas feedparser vaderSentiment

      - name: Run the bot
        run: python bot.py

      - name: Salva Capitale e Storico nel Repository
        run: |
          git config --global user.name "Master Bot Auto"
          git config --global user.email "bot@github.com"
          git add stato_portafoglio.json storico_operazioni.csv || true
          git diff --staged --quiet || git commit -m "Aggiornamento automatico portafoglio e storico"
          git push
          
