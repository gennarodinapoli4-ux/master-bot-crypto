name: Master Bot Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Gira automaticamente ogni ora

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Permessi necessari per permettere al bot di scrivere e salvare file nel repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Salva Stato Portafoglio nel Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add portafoglio_stato.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Aggiornamento automatico stato portafoglio [skip ci]" && git push)
